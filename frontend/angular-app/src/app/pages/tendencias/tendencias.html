<div class="space-y-6">
  <div>
    <h2 class="hel-page-title">Tendencias</h2>
    <p class="hel-page-subtitle">
      Análisis temporal cruzado: distribución de PQRS por tipo y ámbito a lo largo de los meses y relación áreas de solicitud × canal.
    </p>
  </div>

  @if (hayError()) {
    <div class="hel-panel flex flex-col items-center justify-center py-16 text-center">
      <p class="mb-4 text-sm font-medium text-text-primary">No se pudieron cargar los datos.</p>
      <button type="button" class="rounded-lg bg-secondary px-4 py-2 text-xs font-medium text-white" (click)="reintentar()">
        Reintentar
      </button>
    </div>
  } @else if (cargando()) {
    <app-loading />
  } @else {
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-chart-container
        titulo="Tipo de PQRS × Mes"
        subtitulo="Mapa de calor de cruce tipo-mes"
        [opciones]="opcionesTipoMes()"
        [cargando]="cargando()"
        altura="360px"
        [clicFiltro]="'tipos'"
      />
      <app-chart-container
        titulo="Ámbito × Mes"
        subtitulo="Mapa de calor de cruce ámbito-mes"
        [opciones]="opcionesAmbitoMes()"
        [cargando]="cargando()"
        altura="360px"
        [clicFiltro]="'ambitos'"
      />
    </div>

    <app-chart-container
      titulo="Área de solicitud × Canal"
      subtitulo="Mapa de calor de combinaciones área-canal"
      [opciones]="opcionesAreaCanal()"
      [cargando]="cargando()"
      altura="360px"
      [clicFiltro]="'areas'"
    />
  }
</div>
