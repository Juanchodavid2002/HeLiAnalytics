<div class="space-y-6">
  <div>
    <h2 class="hel-page-title">Áreas de solicitud</h2>
    <p class="hel-page-subtitle">
      Distribución de PQRS por área de solicitud y su relación con tipos de PQRS, ámbito de atención y el tiempo mediano de respuesta por área.
    </p>
    <app-info-box contenido="Cada área de solicitud es la dependencia de HeLi Salud donde se radica la PQRS (facturación, consulta externa, urgencias, etc.). Este módulo te permite comparar el volumen de cada área, la mezcla de tipos de PQRS y su velocidad de respuesta. Las cifras responden a los filtros activos." />
  </div>

  @if (hayError()) {
    <div class="hel-panel flex flex-col items-center justify-center py-16 text-center">
      <p class="mb-4 text-sm font-medium text-text-primary">No se pudieron cargar los datos.</p>
      <button type="button" class="rounded-lg bg-secondary px-4 py-2 text-xs font-medium text-white" (click)="reintentar()">
        Reintentar
      </button>
    </div>
  } @else if (cargando()) {
    <app-loading />
  } @else {
    <app-chart-container
      titulo="Distribución por área de solicitud"
      subtitulo="Áreas con PQRS radicadas"
      explicacion="Cada barra muestra cuántas PQRS se radicaron en esa área durante el periodo. Las áreas se ordenan de menor a mayor volumen para identificar de un vistazo los mayores focos de demanda. Haz clic en una barra para filtrar por esa área."
      [opciones]="opcionesRanking()"
      [cargando]="cargando()"
      [clicFiltro]="'areas'"
    />

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-chart-container
        titulo="Área × Tipo de PQRS"
        subtitulo="Barras por tipo de PQRS"
        explicacion="Desglosa para cada área el número de PQRS por tipo. Ayuda a ver si ciertas áreas reciben más reclamos o quejas que peticiones. Haz clic en una columna de área para filtrar."
        [opciones]="opcionesAreaTipo()"
        [cargando]="cargando()"
        altura="320px"
        [clicFiltro]="'areas'"
      />
      <app-chart-container
        titulo="Área × Ámbito"
        subtitulo="Mapa de calor de área-ámbito"
        explicacion="Cruza el área que radica la PQRS con el ámbito de atención del servicio. Si solo hay una celda coloreada por fila, ese área concentra sus solicitudes en un único ámbito. Haz clic en una celda para filtrar por área."
        [opciones]="opcionesAreaAmbito()"
        [cargando]="cargando()"
        altura="320px"
        [clicFiltro]="'areas'"
      />
    </div>

    <app-chart-container
      titulo="Tiempo mediano de respuesta por área"
      subtitulo="Mediana en días por área de solicitud"
      explicacion="Muestra en cuántos días responde la IPS, en el 50% de las PQRS de cada área. La mediana es más confiable que el promedio ante casos atípicos; cuanto más corta la barra, más ágil es la respuesta de esa área. Pasa el cursor para ver el total de registros por área."
      [opciones]="opcionesMedianaArea()"
      [cargando]="cargando()"
      altura="500px"
    />
  }
</div>
