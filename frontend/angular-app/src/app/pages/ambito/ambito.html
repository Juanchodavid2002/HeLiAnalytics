<div class="space-y-6">
  <div>
    <h2 class="hel-page-title">Ámbito</h2>
    <p class="hel-page-subtitle">
      Distribución de PQRS por ámbito de atención (PAD agudo/crónico, ambulatorio, hospitalización), su relación con el tipo de PQRS, la evolución temporal mensual y el tiempo mediano de respuesta.
    </p>
  </div>

  @if (hayError()) {
    <div class="hel-panel flex flex-col items-center justify-center py-16 text-center">
      <p class="mb-4 text-sm font-medium text-text-primary">No se pudieron cargar los datos.</p>
      <button type="button" class="rounded-lg bg-secondary px-4 py-2 text-xs font-medium text-white" (click)="reintentar()">
        Reintentar
      </button>
    </div>
  } @else if (cargando()) {
    <app-loading />
  } @else {
    <app-chart-container
      titulo="Ranking por ámbito de atención"
      subtitulo="PAD agudo/crónico, ambulatorio y hospitalización"
      [opciones]="opcionesRanking()"
      [cargando]="cargando()"
      [clicFiltro]="'ambitos'"
    />

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-chart-container
        titulo="Ámbito × Tipo de PQRS"
        subtitulo="Barras agrupadas por tipo"
        [opciones]="opcionesTipoAmbito()"
        [cargando]="cargando()"
        altura="320px"
        [clicFiltro]="'ambitos'"
      />
      <app-chart-container
        titulo="Evolución mensual por ámbito"
        subtitulo="Mapa de calor de cruce ámbito-mes"
        [opciones]="opcionesAmbitoMes()"
        [cargando]="cargando()"
        altura="320px"
        [clicFiltro]="'ambitos'"
      />
    </div>

    <app-chart-container
      titulo="Tiempo mediano de respuesta por ámbito"
      subtitulo="Mediana en días por categoría de ámbito"
      [opciones]="opcionesMedianaAmbito()"
      [cargando]="cargando()"
      altura="280px"
    />
  }
</div>
