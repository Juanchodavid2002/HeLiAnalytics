<div class="space-y-6">
  <div>
    <h2 class="hel-page-title">Ámbito</h2>
    <p class="hel-page-subtitle">
      Distribución de PQRS por ámbito de atención (PAD agudo/crónico, ambulatorio, hospitalización), su relación con el tipo de PQRS, la evolución temporal mensual y el tiempo mediano de respuesta.
    </p>
    <app-info-box contenido="El ámbito de atención indica dónde se prestan los servicios (consulta ambulatoria, hospitalización o programa de atención domiciliaria PAD). Este módulo te muestra su volumen, la mezcla de tipos de PQRS y qué tan rápido se responden. Los cruces y gráficas responden a los filtros activos." />
  </div>

  @if (hayError()) {
    <div class="hel-panel flex flex-col items-center justify-center py-16 text-center">
      <p class="mb-4 text-sm font-medium text-text-primary">No se pudieron cargar los datos.</p>
      <button type="button" class="rounded-lg bg-secondary px-4 py-2 text-xs font-medium text-white" (click)="reintentar()">
        Reintentar
      </button>
    </div>
  } @else if (cargando()) {
    <app-loading />
  } @else {
    <app-chart-container
      titulo="Ranking por ámbito de atención"
      subtitulo="PAD agudo/crónico, ambulatorio y hospitalización"
      explicacion="Cada barra representa el número total de PQRS radicadas en ese ámbito. Una barra más larga indica mayor volumen de solicitudes. Haz clic en una barra para filtrar el análisis a ese ámbito."
      [opciones]="opcionesRanking()"
      [cargando]="cargando()"
      [clicFiltro]="'ambitos'"
    />

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      <app-chart-container
        titulo="Ámbito × Tipo de PQRS"
        subtitulo="Barras agrupadas por tipo"
        explicacion="Para cada ámbito, se desglosa la cantidad de PQRS por tipo (reclamo, queja, petición, felicitación). Compara la composición entre ámbitos: en cuáles predominan los reclamos frente a las peticiones. Haz clic en un ámbito para filtrar."
        [opciones]="opcionesTipoAmbito()"
        [cargando]="cargando()"
        altura="320px"
        [clicFiltro]="'ambitos'"
      />
      <app-chart-container
        titulo="Evolución mensual por ámbito"
        subtitulo="Mapa de calor de cruce ámbito-mes"
        explicacion="El color de cada celda indica cuántas PQRS de ese ámbito se radicaron en ese mes, permitiendo ver estacionalidad o picos de demanda. Haz clic en una celda para filtrar por ámbito."
        [opciones]="opcionesAmbitoMes()"
        [cargando]="cargando()"
        altura="320px"
        [clicFiltro]="'ambitos'"
      />
    </div>

    <app-chart-container
      titulo="Tiempo mediano de respuesta por ámbito"
      subtitulo="Mediana en días por categoría de ámbito"
      explicacion="Indica cuántos días tardó la IPS, en la mitad (50%) de las PQRS de cada ámbito, en dar respuesta. Usa la mediana porque es más robusta que el promedio ante casos extremos: una barra corta significa resolución más rápida. Pasa el cursor para ver el total de registros."
      [opciones]="opcionesMedianaAmbito()"
      [cargando]="cargando()"
      altura="280px"
    />
  }
</div>
