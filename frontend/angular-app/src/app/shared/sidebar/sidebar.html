<aside
  class="fixed inset-y-0 left-0 z-40 flex w-72 flex-col border-r border-[var(--border)] bg-white transition-transform duration-300 lg:sticky"
  [class.-translate-x-full]="abierto() === false"
  [class.lg:translate-x-0]="true"
  [class.translate-x-0]="abierto()"
  [class.w-24]="colapsado()"
  [class.lg:w-72]="!colapsado()"
>
  <div class="flex h-auto shrink-0 items-center justify-between border-b border-[var(--border)] px-5 py-5" [class.lg:justify-center]="colapsado()">
    <a routerLink="/dashboard" class="flex items-center gap-3" (click)="cerrarEnMovil.emit()">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-[var(--primary)] to-[var(--secondary)] shadow-lg shadow-blue-500/30" style="box-shadow: 0 10px 15px -3px rgba(37,99,235,0.3);">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </span>
      <span class="flex min-w-0 flex-col leading-tight" [class.hidden]="colapsado()">
        <span class="truncate font-bold text-[var(--text)]">HeLi Analytics</span>
        <span class="truncate text-[10px] font-medium uppercase tracking-widest text-[var(--text-muted)]">PQRS Intelligence</span>
      </span>
    </a>
    <button
      type="button"
      class="hidden rounded-lg p-1 text-[var(--text-muted)] hover:bg-surface hover:text-[var(--text)] lg:block"
      (click)="colapsar.emit()"
      aria-label="Colapsar menú"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [class.rotate-180]="colapsado() === false" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto p-3">
    @for (seccion of secciones; track seccion.etiqueta) {
      <div class="px-3 pb-2 pt-3 text-[10px] font-semibold uppercase tracking-widest text-[var(--text-muted)] first:pt-0 [&:not(:first-child)]:mt-3">
        {{ seccion.etiqueta }}
      </div>
      @for (item of seccion.items; track item.ruta) {
        <a
          routerLink="{{ item.ruta }}"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="cerrarEnMovil.emit()"
          class="nav-link"
          [attr.title]="colapsado() ? item.etiqueta : null"
        >
          <span class="flex h-6 w-6 shrink-0 items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              @switch (item.icono) {
                @case ('squares') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                }
                @case ('trend') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 15.5L5.5 12l4 3 5-8 8 8.5M3 20h18" />
                }
                @case ('alert') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                }
                @case ('files') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 3h9l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1zm3 10h6m-6 4h6M10 9h4" />
                }
                @case ('users') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-1a4 4 0 00-3-3.87V15a4 4 0 00-2.5-3.7 3 3 0 10-5.8.05M17 20H2v-1a4 4 0 013-3.87V15M5 5.75a3 3 0 106 .17M9 8.5a3 3 0 00-1.5-2.6" />
                }
                @case ('text') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 4h12M6 8h12m-12 4h12m-12 4h7" />
                }
                @case ('bulb') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9.66 17.6c-.1.6.1 1.15.55 1.5.55.4 1.29.4 1.84.4s1.3 0 1.85-.4c.45-.35.65-.9.54-1.5M9.66 17.6a7 7 0 114.72 0M8.62 21.4h6.76M10.3 12.2c.9-1.34 2.68-1.3 3.73-2.34.73-.72 1.1-1.9.56-2.98-.4-.79-1.1-1.4-1.97-1.5" />
                }
                @case ('globe') {
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z" />
                }
              }
            </svg>
          </span>
          <span class="truncate" [class.hidden]="colapsado()">{{ item.etiqueta }}</span>
          @if (item.badge && !colapsado()) {
            <span class="badge">{{ item.badge }}</span>
          }
        </a>
      }
    }
  </nav>

  <div class="border-t border-[var(--border)] p-3">
    <div class="rounded-xl border border-blue-100 bg-gradient-to-br from-blue-50 to-violet-50 p-3">
      <div class="mb-2 flex items-center gap-2">
        <div class="status-dot"></div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-600">Sistema activo</span>
      </div>
      <p class="text-[11px] leading-relaxed text-[var(--text-secondary)] [&:not(:empty)]:block" [class.hidden]="colapsado()">
        HeLi Salud IPS · PQRS II Semestre 2025
      </p>
    </div>
  </div>
</aside>
