<div class="kpi-card card p-4 fade-in" [style]="cssVars()">
  <div class="mb-3 flex items-start justify-between">
    <span class="icon-box" [class]="paleta(color()).fondo">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        @switch (icono()) {
          @case ('doc') {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 3h9l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1zm10 0v5h5" />
          }
          @case ('clock') {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          }
          @case ('alert') {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          }
          @case ('mail') {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          }
          @case ('hosp') {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          }
          @case ('user') {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          }
          @case ('chart') {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          }
        }
      </svg>
    </span>
    @if (tag()) {
      <span class="tag" [class]="tagClase()">{{ tag() }}</span>
    }
  </div>
  <div class="relative z-10">
    <p class="text-[11px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">{{ titulo() }}</p>
    <p class="mt-1 font-mono text-3xl font-bold text-[var(--text)]">{{ valor() }}</p>
    @if (subtexto()) {
      <p class="mt-1 text-xs text-[var(--text-secondary)]">{{ subtexto() }}</p>
    }
    @if (mostrarSparkline()) {
      <div class="sparkline-bar mt-3 text-[var(--primary)]">
        <span style="height:40%"></span><span style="height:55%"></span><span style="height:48%"></span>
        <span style="height:70%"></span><span style="height:62%"></span><span style="height:85%"></span>
        <span style="height:78%"></span><span style="height:95%"></span>
      </div>
    }
  </div>
</div>
