@if (contenido()) {
  <div class="inline-flex items-center gap-1.5">
    <button
      type="button"
      class="flex h-6 w-6 items-center justify-center rounded-full border border-[var(--border)] bg-white text-[var(--text-muted)] transition-colors hover:border-[var(--primary)] hover:text-[var(--primary)]"
      [class]="abierto() ? 'border-[var(--primary)] text-[var(--primary)]' : ''"
      [attr.aria-expanded]="abierto()"
      (click)="alternar()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </button>
    @if (etiqueta()) {
      <span class="hidden text-[11px] font-medium text-[var(--text-muted)] sm:inline">
        {{ etiqueta() }}
      </span>
    }
  </div>

  @if (abierto()) {
    <div class="mt-2 rounded-lg border border-[var(--border-soft)] bg-[var(--bg-soft)] p-3 text-[11px] leading-relaxed text-[var(--text-secondary)]">
      {{ contenido() }}
    </div>
  }
}
