<div class="card flex flex-col p-5 fade-in">
  <div class="mb-2 flex items-center justify-between">
    <div class="panel-title">
      <span class="dot"></span>
      <h3>{{ titulo() }}</h3>
    </div>
  </div>
  @if (subtitulo()) {
    <p class="mb-4 text-[11px] text-[var(--text-muted)]">{{ subtitulo() }}</p>
  }

  @if (cargando()) {
    <div class="flex items-center justify-center" [style.height]="altura()">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-[var(--primary)]"></div>
    </div>
  } @else if (opciones() !== null) {
    <div echarts [options]="opciones()!" class="w-full" [style.height]="altura()" [autoResize]="true"></div>
  } @else {
    <div class="flex flex-col items-center justify-center rounded-lg bg-[var(--bg-soft)] text-center" [style.height]="altura()">
      <svg xmlns="http://www.w3.org/2000/svg" class="mb-2 h-10 w-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
      </svg>
      <p class="text-sm text-[var(--text-secondary)]">Sin datos disponibles</p>
    </div>
  }
</div>
