<div class="flex min-h-screen">

  @if (abierto()) {
    <div
      class="fixed inset-0 z-30 bg-black/50 lg:hidden"
      (click)="abierto.set(false)"
      aria-hidden="true"
    ></div>
  }

  <app-sidebar
    [colapsado]="colapsado()"
    [abierto]="abierto()"
    (colapsar)="colapsado.set(!colapsado())"
    (cerrarEnMovil)="abierto.set(false)"
  />

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 border-b border-[var(--border)] bg-white/80 backdrop-blur-lg">
      <div class="flex h-16 items-center gap-3 px-4 lg:px-8">
        <button
          type="button"
          class="flex h-10 w-10 items-center justify-center rounded-lg text-[var(--text-secondary)] hover:bg-surface hover:text-[var(--text)] lg:hidden"
          (click)="alternarMovil()"
          aria-label="Abrir menú de navegación"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="min-w-0 flex-1">
          <div class="mb-0.5 flex items-center gap-2 text-[11px] text-[var(--text-muted)]">
            <span>Analytics</span>
            <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
            <span class="font-medium text-[var(--primary)]">Explorador</span>
          </div>
          <h1 class="truncate text-lg font-bold text-[var(--text)] lg:text-xl">Centro de Inteligencia de PQRS</h1>
        </div>
        <div class="hidden items-center gap-2 md:flex">
          <div class="flex items-center gap-2 rounded-lg border border-emerald-100 bg-emerald-50 px-3 py-1.5">
            <div class="status-dot"></div>
            <span class="text-xs font-medium text-emerald-700">En vivo</span>
          </div>
          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded-lg border border-[var(--border)] bg-white text-[var(--text-secondary)] transition-colors hover:border-[var(--primary)] hover:text-[var(--primary)]"
            aria-label="Notificaciones"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0" />
            </svg>
          </button>
          <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-[var(--primary)] to-[var(--secondary)] text-sm font-bold text-white shadow-md shadow-blue-500/30">HA</div>
        </div>
      </div>
    </header>

    <div class="mx-auto w-full max-w-7xl flex-1 px-4 lg:px-8">
      <div class="filter-section pt-4">
        <app-filter-bar class="block" />
      </div>
      <main class="space-y-6 pb-6">
        <router-outlet />
      </main>
    </div>

    <footer class="px-8 py-4 text-center">
      <div class="inline-flex items-center gap-2 text-xs text-[var(--text-muted)]">
        <span class="h-1.5 w-1.5 rounded-full bg-gradient-to-r from-[var(--primary)] to-[var(--secondary)]"></span>
        HeLi Analytics · Proyecto de analítica de datos — Especialización en Analítica de Datos
      </div>
    </footer>
  </div>
</div>
